<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animation demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<!-- Demo only: renders a markdown snippet with a GIF and an MP4 the way research posts do. -->
<div id="demo" class="blog-post-body prose" style="max-width: 640px; margin: 20px auto;"></div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script src="../js/research-blog.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  ResearchBlog.renderMarkdown(
    document.getElementById("demo"),
    "A GIF:\n\n![sample gif](sample.gif)\n\nAn MP4:\n\n![sample video](sample.mp4)\n\nMath: $e^{i\\pi}+1=0$"
  );
});
</script>
</body>
</html>
